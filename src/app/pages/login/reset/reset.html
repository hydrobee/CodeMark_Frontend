<div class="reset-container">
  <div class="reset-card">
    <h2>Reset Password</h2>
    <p class="subtitle">Enter your email and choose a new password</p>

    <div *ngIf="success" class="success-msg">
      ✅ Password reset successfully! Redirecting to login...
    </div>

    <div *ngIf="!success">
      <div class="form-group">
        <label>Email</label>
        <input type="email" [(ngModel)]="email" placeholder="Enter your email" />
      </div>

      <div class="form-group">
        <label>New Password</label>
        <input type="password" [(ngModel)]="newPassword" placeholder="Enter new password" />
      </div>

      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" [(ngModel)]="confirmPassword" placeholder="Confirm new password" />
      </div>

      <div *ngIf="error" class="error-msg">{{ error }}</div>

      <button class="btn-reset" [disabled]="isLoading" (click)="submit()">
        {{ isLoading ? 'Resetting...' : 'Reset Password' }}
      </button>

      <p class="back-link">
        <a routerLink="/login">← Back to Login</a>
      </p>
    </div>
  </div>
</div>
