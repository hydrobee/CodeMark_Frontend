<div class="sidebar">

  <!-- Logo -->
  <div class="logo" (click)="navigate('/lecturer-dashboard')">
    <div class="logo-icon">
      <img src="/CodeMark Logo.png" alt="CodeMark Logo">
    </div>
  </div>

  <!-- Menu -->
  <div class="menu">
    <div class="menu-item" 
         [class.active]="activeRoute === '/lecturer-dashboard'" 
         (click)="navigate('/lecturer-dashboard')">
      <img src="/Dashboard.png" alt="Dashboard Icon" class="icon">
      <span>Dashboard</span>
    </div>

    <div class="menu-item" 
         [class.active]="activeRoute === '/lecturer-review'" 
         (click)="navigate('/lecturer-review')">
      <img src="/Submission.png" alt="Submission Icon" class="icon">
      <span>Review</span>
    </div>

    <div class="menu-item" 
         [class.active]="activeRoute === '/assignment-management'" 
         (click)="navigate('/assignment-management')">
      <img src="/Feedback.png" alt="Feedback Icon" class="icon">
      <span>Assignment Management</span>
    </div>

    <div class="menu-item" 
         [class.active]="activeRoute === '/lecturer-performance'" 
         (click)="navigate('/lecturer-performance')">
      <img src="/Performance.png" alt="Performance Icon" class="icon">
      <span>Performance</span>
    </div>
  </div>

  <!-- Bottom Menu -->
  <div class="bottom-menu">
    <div class="menu-item">
      <img src="/Settings.png" alt="Settings Icon" class="icon">
      <span>Settings</span>
    </div>

    <div class="menu-item">
      <img src="/Support.png" alt="Support Icon" class="icon">
      <span>Support</span>
    </div>

    <div class="menu-item logout" (click)="logout()">
      <span>Logout</span>
    </div>
  </div>

</div>
