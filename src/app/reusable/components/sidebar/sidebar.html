<div class="sidebar">

  <!-- Logo -->
  <div class="logo" (click)="navigate('/student')">
    <div class="logo-icon">
      <img src="/CodeMark Logo.png" alt="CodeMark Logo">
    </div>
  </div>

  <!-- Menu -->
  <div class="menu">
    <div class="menu-item" 
         [class.active]="activeRoute === '/student'" 
         (click)="navigate('/student')">
      <img src="/Dashboard.png" alt="Dashboard Icon" class="icon">
      <span>Dashboard</span>
    </div>

    <div class="menu-item" 
         [class.active]="activeRoute === '/submission'" 
         (click)="navigate('/student-submission')">
      <img src="/Submission.png" alt="Submission Icon" class="icon">
      <span>Submission</span>
    </div>

    <div class="menu-item" 
         [class.active]="activeRoute === '/feedback'" 
         (click)="navigate('/feedback')">
      <img src="/Feedback.png" alt="Feedback Icon" class="icon">
      <span>Feedback</span>
    </div>

    <div class="menu-item" 
         [class.active]="activeRoute === '/performance'" 
         (click)="navigate('/performance')">
      <img src="/Performance.png" alt="Performance Icon" class="icon">
      <span>Performance</span>
    </div>
  </div>

  <!-- Bottom Menu -->
  <div class="bottom-menu">
    <div class="menu-item">
      <img src="/Settings.png" alt="Settings Icon" class="icon">
      <span>Settings</span>
    </div>

    <div class="menu-item">
      <img src="/Support.png" alt="Support Icon" class="icon">
      <span>Support</span>
    </div>

    <div class="menu-item logout" (click)="logout()">
      <span>Logout</span>
    </div>
  </div>

</div>
