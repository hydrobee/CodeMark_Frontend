<div class="page-bg">
  <div class="card">

    <!-- Tab Toggle -->
    <div class="tab-row">
      <button class="tab" 
              [class.active]="isLoginMode === false" 
              (click)="switchTab('signup')">Sign up</button>
      <button class="tab" 
              [class.active]="isLoginMode === true" 
              (click)="switchTab('signin')">Sign in</button>
    </div>

    <!-- Sign Up Form -->
    <div class="form-panel" [class.hidden]="isLoginMode">
      <h2 class="form-title">Create an account</h2>

      <div class="row-two">
        <input class="field" type="text" placeholder="First Name" [(ngModel)]="name" name="name" required />
        <input class="field" type="text" placeholder="Last Name" [(ngModel)]="lastName" name="lastName" />
      </div>

      <div class="select-wrap">
        <select class="field select" [(ngModel)]="role" name="role" required>
          <option value="" disabled selected>Select Role</option>
          <option value="student">Student</option>
          <option value="lecturer">Lecturer</option>
        </select>
        <span class="chevron">&#8964;</span>
      </div>

      <!-- Student fields -->
      <div *ngIf="role === 'student'">
        <input class="field" type="text" placeholder="Matric No" [(ngModel)]="matricNo" name="matricNo" required />
        <input class="field" type="text" placeholder="Group No" [(ngModel)]="groupNo" name="groupNo" required />
      </div>

      <!-- Lecturer field -->
      <div *ngIf="role === 'lecturer'">
        <input class="field" type="text" placeholder="Staff ID" [(ngModel)]="staffId" name="staffId" required />
      </div>

      <input class="field" type="email" placeholder="Enter your email" [(ngModel)]="email" name="email" required />
      <input class="field" type="password" placeholder="Password" [(ngModel)]="password" name="password" required />
      <input class="field" type="password" placeholder="Confirm Password" [(ngModel)]="confirmPassword" name="confirmPassword" required />

      <button class="btn-primary" (click)="onSignup()">Create an account</button>

      <p style="color:red" *ngIf="errorMsg">{{ errorMsg }}</p>

      <div class="brand">
        <div class="brand-icon">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="14" cy="14" r="13" stroke="white" stroke-width="1.5"/>
            <text x="14" y="19" text-anchor="middle" fill="white" font-size="11" font-family="Sora" font-weight="600">M</text>
          </svg>
        </div>
        <span class="brand-name">CodeMark</span>
      </div>

      <p class="terms">By creating an account, you agree to our <a href="#">Terms & Service</a></p>
    </div>

    <!-- Sign In Form -->
    <div class="form-panel" [class.hidden]="!isLoginMode">
      <h2 class="form-title">Welcome back</h2>

      <input class="field" type="email" placeholder="Enter your email" [(ngModel)]="email" name="loginEmail" required />
      <input class="field" type="password" placeholder="Password" [(ngModel)]="password" name="loginPassword" required />

      <a href="#" class="forgot">Forgot password?</a>
      <button class="btn-primary" (click)="onLogin()">Sign in</button>

      <p style="color:red" *ngIf="errorMsg">{{ errorMsg }}</p>

      <div class="brand">
        <div class="brand-icon">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="14" cy="14" r="13" stroke="white" stroke-width="1.5"/>
            <text x="14" y="19" text-anchor="middle" fill="white" font-size="11" font-family="Sora" font-weight="600">M</text>
          </svg>
        </div>
        <span class="brand-name">CodeMark</span>
      </div>

      <p class="terms">By signing in, you agree to our <a href="#">Terms & Service</a></p>
    </div>

  </div>
</div>
