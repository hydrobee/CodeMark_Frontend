<div class="page-bg">
  <div class="card">

    <div class="brand">
      <div class="brand-icon">
        <img src="assets/logo.png" alt="CodeMark" width="24" height="24" />
      </div>
      <span class="brand-name">CODEMARK</span>
    </div>

    <h2 class="form-title">Reset Password</h2>
    <p class="subtitle">Enter your email and choose a new password</p>

    <div *ngIf="success" class="success-msg">
      ✅ Password reset successfully! Redirecting to login...
    </div>

    <div *ngIf="!success">
      <input class="field" type="email" [(ngModel)]="email" placeholder="Email" />
      <input class="field" type="password" [(ngModel)]="newPassword" placeholder="New Password" />
      <input class="field" type="password" [(ngModel)]="confirmPassword" placeholder="Confirm Password" />

      <div *ngIf="error" class="error-msg">{{ error }}</div>

      <button class="btn-primary" [disabled]="isLoading" (click)="submit()">
        {{ isLoading ? 'Resetting...' : 'Reset Password' }}
      </button>

      <p class="back-link">
        <a routerLink="/login">← Back to Login</a>
      </p>
    </div>

  </div>
</div>
