<div class="dashboard-layout">
  <app-sidebar-lecturer></app-sidebar-lecturer>

  <div class="main-content">
    <!-- Header -->
    <div class="page-header">
      <div class="header-left">
        <div class="submission-logo">
          <img src="Support.png" alt="Support Logo" />
        </div>
        <div class="welcome-section">
          <h1>Support Center</h1>
          <p class="subtitle">Everything you need to get help fast</p>
        </div>
      </div>
    </div>

    <div class="dashboard-content">

      <!-- Row 1: User Guide (full width, prominent) -->
      <div class="grid-full">
        <div class="cards-row accent-blue">
          <div class="cards-content cards-content--horizontal">
            <div class="card-icon">📖</div>
            <div class="card-body">
              <h6>User Guide</h6>
              <p class="card-desc">Step-by-step guides to help you navigate CodeMark</p>
              <div class="button-group">
                <!-- <button class="pill-btn">Student guide</button> -->
                <button class="pill-btn">Lecturer guide</button>
              </div>
            </div>
            <!-- <div class="card-arrow">→</div> -->
          </div>
        </div>
      </div>

      <!-- Row 2: Contact + Bug side by side -->
      <div class="grid-2">

        <div class="cards-row accent-green">
          <div class="cards-content cards-content--vertical">
            <div class="card-icon">💬</div>
            <div class="card-body">
              <h6>Contact Support</h6>
              <p class="card-desc">Reach out and we'll get back to you as soon as possible</p>
              <button class="pill-btn pill-btn--full">Open Support Form</button>
            </div>
          </div>
        </div>

        <!-- <div class="cards-row accent-red">
          <div class="cards-content cards-content--vertical">
            <div class="card-icon">🐛</div>
            <div class="card-body">
              <h6>Report a Bug</h6>
              <p class="card-desc">Found something broken? Help us fix it faster</p>
              <button class="pill-btn pill-btn--full">Open Bug Report</button>
            </div>
          </div>
        </div> -->

        <div class="cards-row accent-yellow">
          <div class="cards-content cards-content--vertical">
            <div class="card-icon">
              <img src="CodeMark Logo.png" alt="CodeMark" />
            </div>
            <div class="card-body">
              <h6>About CodeMark</h6>
              <p class="card-desc">AI-powered assignment grading platform for lecturers and students</p>
              <div class="button-group">
                <button class="pill-btn">Description</button>
                <button class="pill-btn">v1.0.0</button>
              </div>
            </div>
            <!-- <div class="card-arrow">→</div> -->
          </div>
        </div>

      </div>

      <!-- Row 3: About (full width, minimal) -->
      <div class="grid-full">
        
      </div>

    </div>
  </div>
